title: Network discovery tool executed
status: stable
logsource:
  product: linux
  category: process_creation
detection:
  selection_tool:
    Image|endswith:
      - '/nc'
      - '/ncat'
      - '/netcat'
      - '/nc.openbsd'
      - '/nmap'
  selection_loop:
    CommandLine|contains|all:
      - 'for port'
      - '/dev/tcp/'
  condition: selection_tool or selection_loop
tags:
  - attack.discovery
  - attack.t1046
